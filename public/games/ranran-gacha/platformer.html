<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranran Super Stage</title>
<meta name="description" content="Game platformer pixel art dengan Ranran (Song Xinran). Mini game fan-made.">
<style>
  :root { --bg: #09090b; --line: #ffffff1a; --text: #fafafa; --muted: #a1a1aa; --rose: #fda4af; --amber: #fde68a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at top, #3f1d2b 0%, var(--bg) 60%) fixed, var(--bg);
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .top a { color: var(--muted); }
  h1 { margin: 12px 0 16px; font-size: clamp(24px, 6vw, 34px); }
  h1 span { background: linear-gradient(90deg, var(--rose), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  canvas { display: block; width: 100%; aspect-ratio: 320 / 192; image-rendering: pixelated; border-radius: 12px; border: 1px solid var(--line); background: #000; touch-action: none; }
  .pad { display: flex; gap: 12px; margin-top: 12px; user-select: none; -webkit-user-select: none; }
  .pad button { flex: 1; height: 64px; font-size: 24px; border-radius: 16px; border: 1px solid var(--line); background: #27272a; color: var(--text); touch-action: none; }
  .pad .jump { flex: 1.4; background: linear-gradient(90deg, var(--rose), var(--amber)); color: #000; border: 0; }
  .pad button:active { filter: brightness(1.3); }
  @media (pointer: fine) { .pad { display: none; } }
  .hint { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="top"><a href="index.html">← Gacha</a><a href="puzzle.html">Puzzle →</a></div>
  <h1>Ranran <span>Super Stage</span></h1>
  <canvas id="game" width="320" height="192" tabindex="0" aria-label="Game platformer. Panah kiri kanan untuk jalan, spasi untuk lompat."></canvas>
  <div class="pad">
    <button data-k="left" aria-label="Kiri">◀</button>
    <button data-k="right" aria-label="Kanan">▶</button>
    <button data-k="jump" class="jump" aria-label="Lompat">▲</button>
  </div>
  <p class="hint">← → / A D jalan · Spasi / ↑ / Z lompat (tahan = lebih tinggi) · Injak Gloomy, sundul balok ?, kumpulkan lightstick, sampai ke tiang bendera!</p>
</main>

<script>
const T = 16, VW = 320, VH = 192, W = 160, H = 12;
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ---------- Sprite pixel art (1 huruf = 1 piksel) ----------
const PAL = {
  h: "#4a2318", H: "#8a4a32", s: "#ffe2d4", e: "#1c1917", l: "#e11d48", b: "#fda4af",
  w: "#fafafa", t: "#18181b", k: "#52525b", d: "#18181b", p: "#7c3aed", W: "#ffffff",
};
function sprite(rows) {
  const c = document.createElement("canvas");
  c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext("2d");
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1); } }));
  return c;
}
const BODY = [
  "...hhhhhh...",
  "..hHHhhhhh..",
  ".hhhhhhhhhh.",
  "hhhhhhhhhhhh",
  "hhsssssssshh",
  "hhsesssseshh",
  "hhsbssssbshh",
  "hhsssllssshh",
  "hhhwwttwwhhh",
  "hhwwwttwwwhh",
  "hswwwttwwwsh",
  ".swwwttwwws.",
  "..kkkkkkkk..",
  "..kkkkkkkk..",
];
const RAN_A = sprite([...BODY, "...ss..ss...", "...dd..dd..."]); // berdiri
const RAN_B = sprite([...BODY, "..ss....ss..", "..dd....dd.."]); // melangkah / lompat
const GLOOMY = sprite([
  "....pppp....",
  "..pppppppp..",
  ".pppppppppp.",
  ".pWWppppWWp.",
  "ppWtppppWtpp",
  "pppppppppppp",
  "ppppttttpppp",
  "pppppppppppp",
  ".pppppppppp.",
  "..pp....pp..",
  ".ppp....ppp.",
]);

// Wajah asli Ranran, dipixelkan jadi 28×32 untuk layar judul & menang.
let portrait = null;
const photo = new Image();
photo.onload = () => {
  portrait = document.createElement("canvas");
  portrait.width = 28; portrait.height = 32;
  portrait.getContext("2d").drawImage(photo, 248, 90, 245, 280, 0, 0, 28, 32);
};
photo.src = "images/campus-idol.jpg";

// ---------- Level ----------
// # tanah/blok  B bata  ? balok hadiah  U balok kosong  S speaker  o lightstick
let map, enemies;
function buildLevel() {
  map = Array.from({ length: H }, () => Array(W).fill("."));
  const put = (x, y, ch) => { map[y][x] = ch; };
  const row = (x0, x1, y, ch) => { for (let x = x0; x <= x1; x++) put(x, y, ch); };
  const col = (x, y0, y1, ch) => { for (let y = y0; y <= y1; y++) put(x, y, ch); };

  row(0, W - 1, 10, "#"); row(0, W - 1, 11, "#");
  for (const [a, b] of [[30, 32], [61, 63], [96, 99], [128, 129]]) { row(a, b, 10, "."); row(a, b, 11, "."); }

  put(10, 6, "?");
  row(15, 19, 6, "B"); put(16, 6, "?"); put(18, 6, "?"); put(17, 2, "?");
  for (const [x, y0] of [[24, 8], [38, 7], [46, 6]]) { col(x, y0, 9, "S"); col(x + 1, y0, 9, "S"); }
  row(30, 32, 7, "o");
  row(52, 60, 6, "B"); put(56, 6, "?"); row(52, 60, 5, "o");
  row(61, 63, 7, "o");
  row(67, 73, 6, "B"); put(70, 6, "?"); put(70, 2, "?");
  put(78, 6, "?"); put(81, 6, "?"); put(84, 6, "?"); put(81, 2, "?");
  for (let i = 0; i < 4; i++) { col(92 + i, 9 - i, 9, "#"); col(103 - i, 9 - i, 9, "#"); }
  row(96, 99, 4, "o");
  row(108, 112, 6, "B"); put(110, 6, "?"); row(108, 112, 9, "o");
  for (let x = 118; x <= 126; x += 2) put(x, 8, "o");
  row(127, 130, 6, "B");
  for (let i = 0; i < 8; i++) col(140 + i, 9 - i, 9, "#");

  enemies = [20, 34, 42, 52, 54, 76, 84, 86, 106, 115, 117, 135]
    .map((tx) => ({ x: tx * T + 2, y: 10 * T - 11, w: 12, h: 11, vx: 0, vy: 0, dir: -1, dead: 0 }));
}
const GOAL_X = 152 * T + 7, CHECKPOINT = 80;

const SOLID = "#B?SU";
const tile = (tx, ty) => ty < 0 || ty >= H ? "." : tx < 0 || tx >= W ? "#" : map[ty][tx];
const solid = (tx, ty) => SOLID.includes(tile(tx, ty));

buildLevel();
console.assert(map.every((r) => r.length === W), "baris level tidak sama panjang");
console.assert(!solid(3, 9) && solid(3, 10), "posisi awal tidak valid");
console.assert(!solid(CHECKPOINT, 9) && solid(CHECKPOINT, 10), "checkpoint tidak valid");
console.assert(enemies.every((e) => !solid(e.x / T | 0, 9) && solid(e.x / T | 0, 10)), "musuh di posisi tidak valid");

// ---------- Fisika ----------
function hits(e) {
  const out = [];
  for (let ty = Math.floor(e.y / T); ty <= Math.floor((e.y + e.h - 0.01) / T); ty++)
    for (let tx = Math.floor(e.x / T); tx <= Math.floor((e.x + e.w - 0.01) / T); tx++)
      if (solid(tx, ty)) out.push([tx, ty]);
  return out;
}
function moveX(e) {
  e.x += e.vx;
  const hs = hits(e);
  if (!hs.length) return false;
  if (e.vx > 0) e.x = Math.min(...hs.map(([tx]) => tx)) * T - e.w;
  else if (e.vx < 0) e.x = (Math.max(...hs.map(([tx]) => tx)) + 1) * T;
  e.vx = 0;
  return true;
}
function moveY(e) {
  e.y += e.vy;
  e.onGround = false;
  const hs = hits(e);
  if (!hs.length) return null;
  if (e.vy > 0) { e.y = Math.min(...hs.map(([, ty]) => ty)) * T - e.h; e.onGround = true; }
  else if (e.vy < 0) e.y = (Math.max(...hs.map(([, ty]) => ty)) + 1) * T;
  const up = e.vy < 0;
  e.vy = 0;
  // Balok yang disundul = yang paling dekat dengan tengah kepala.
  return up ? hs.reduce((a, b) => Math.abs(b[0] * T + 8 - (e.x + e.w / 2)) < Math.abs(a[0] * T + 8 - (e.x + e.w / 2)) ? b : a) : null;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// ---------- State ----------
const keys = {}, prev = {};
let state = "title", p, cam, lives, coins, score, tick = 0, timer = 0, checkpoint, pops, bumps;

function newGame() { lives = 3; coins = 0; score = 0; checkpoint = 3; spawn(); }
function spawn() {
  buildLevel();
  p = { x: checkpoint * T + 3, y: 10 * T - 15, w: 10, h: 15, vx: 0, vy: 0, onGround: false, coyote: 0, buf: 0 };
  cam = 0; pops = []; bumps = []; state = "play";
}
function die() { state = "dying"; timer = 100; p.vy = -6; }

function update() {
  tick++;
  const jumpHit = keys.jump && !prev.jump;
  Object.assign(prev, keys);

  if (state === "title" || state === "over" || state === "win") { if (jumpHit) newGame(); return; }
  if (state === "dying") {
    p.vy += 0.35; p.y += p.vy;
    if (--timer <= 0) { if (--lives <= 0) state = "over"; else spawn(); }
    return;
  }

  // Pemain
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) p.vx += dir * 0.25; else p.vx *= p.onGround ? 0.8 : 0.95;
  p.vx = Math.max(-2.4, Math.min(2.4, p.vx));
  if (Math.abs(p.vx) < 0.05) p.vx = 0;
  p.coyote = p.onGround ? 6 : p.coyote - 1; // boleh lompat sesaat setelah lewat tepi
  p.buf = jumpHit ? 6 : p.buf - 1;          // tombol lompat ditekan sedikit sebelum mendarat tetap dihitung
  if (p.buf > 0 && p.coyote > 0) { p.vy = -7.2; p.buf = 0; p.coyote = 0; }
  if (!keys.jump && p.vy < -3) p.vy = -3;   // lepas tombol = lompat lebih rendah
  p.vy = Math.min(p.vy + 0.35, 7);
  moveX(p);
  const head = moveY(p);
  if (head) {
    const [tx, ty] = head;
    if (map[ty][tx] === "?") { map[ty][tx] = "U"; coins++; score += 100; pops.push({ x: tx * T + 5, y: ty * T - 12, t: 30 }); }
    bumps.push({ tx, ty, t: 8 });
  }
  for (let ty = Math.floor(p.y / T); ty <= Math.floor((p.y + p.h) / T); ty++)
    for (let tx = Math.floor(p.x / T); tx <= Math.floor((p.x + p.w) / T); tx++)
      if (tile(tx, ty) === "o") { map[ty][tx] = "."; coins++; score += 50; }
  if (p.x / T > CHECKPOINT) checkpoint = CHECKPOINT;
  if (p.y > H * T) return die();
  if (p.x + p.w > GOAL_X) { state = "win"; score += lives * 500; return; }

  // Musuh (baru bergerak saat dekat layar)
  for (const e of enemies) {
    if (e.dead) { e.dead--; continue; }
    if (e.gone || e.x > cam + VW + 32) continue;
    e.vx = e.dir * 0.5;
    e.vy = Math.min(e.vy + 0.35, 7);
    if (moveX(e)) e.dir *= -1;
    moveY(e);
    if (e.y > H * T) { e.gone = true; continue; }
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 4) { e.dead = 30; e.gone = true; p.vy = keys.jump ? -7 : -4.5; score += 200; }
      else return die();
    }
  }
  pops = pops.filter((o) => (o.y -= 1.5, --o.t > 0));
  bumps = bumps.filter((b) => --b.t > 0);
  cam = Math.max(0, Math.min(W * T - VW, p.x - VW / 2 + 40));
}

// ---------- Gambar ----------
const sky = ctx.createLinearGradient(0, 0, 0, VH);
sky.addColorStop(0, "#f9a8d4"); sky.addColorStop(1, "#fde68a");
const rect = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
const Q = [".XX.", "X..X", "...X", "..X.", "....", "..X."];

function drawStick(x, y) {
  rect("#e5e7eb", x + 2, y + 6, 2, 6);
  rect("#f472b6", x, y, 6, 6);
  rect("#fff", x + 1, y + 1, 2, 2);
}
function drawTile(ch, x, y, tx, ty) {
  if (ch === "#") {
    rect("#b45309", x, y, T, T);
    rect("#92400e", x + 3, y + 9, 2, 2); rect("#92400e", x + 11, y + 5, 2, 2);
    if (tile(tx, ty - 1) !== "#") { rect("#22c55e", x, y, T, 4); rect("#15803d", x, y + 4, T, 1); }
  } else if (ch === "B") {
    rect("#c2410c", x, y, T, T);
    rect("#7c2d12", x, y + 7, T, 1); rect("#7c2d12", x, y + 15, T, 1);
    rect("#7c2d12", x + 7, y, 1, 7); rect("#7c2d12", x + 3, y + 8, 1, 7); rect("#7c2d12", x + 11, y + 8, 1, 7);
  } else if (ch === "?" || ch === "U") {
    rect("#78350f", x, y, T, T);
    rect(ch === "?" ? "#f59e0b" : "#a16207", x + 1, y + 1, T - 2, T - 2);
    if (ch === "?") Q.forEach((r, j) => [...r].forEach((c, i) => { if (c === "X") rect("#fff", x + 5 + i * 2 - 1, y + 3 + j * 2 - 1, 2, 2); }));
  } else if (ch === "S") {
    rect("#27272a", x, y, T, T);
    if (tile(tx, ty - 1) !== "S") rect("#52525b", x, y, T, 3);
    const left = tile(tx - 1, ty) !== "S";
    rect("#3f3f46", left ? x + 10 : x - 6, y + 5, 12, 8);
    rect("#18181b", left ? x + 13 : x - 3, y + 7, 6, 4);
  } else if (ch === "o") {
    drawStick(x + 5, y + 2 + (((tick >> 4) + tx) & 1));
  }
}
function text(s, x, y, c = "#fff", align = "left") {
  ctx.font = "bold 8px monospace"; ctx.textAlign = align;
  ctx.fillStyle = "#0009"; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function drawPortrait(y) {
  if (!portrait) return;
  rect("#fff", VW / 2 - 44, y - 2, 88, 100);
  ctx.drawImage(portrait, VW / 2 - 42, y, 84, 96);
}

function draw() {
  rect(sky, 0, 0, VW, VH);
  if (state === "title" || state === "over" || state === "win") {
    rect("#0008", 0, 0, VW, VH);
    drawPortrait(18);
    const title = { title: "RANRAN SUPER STAGE", over: "GAME OVER", win: "STAGE CLEAR! ★" }[state];
    text(title, VW / 2, 136, "#fde68a", "center");
    if (state !== "title") text(`SKOR ${score} · LIGHTSTICK ${coins}`, VW / 2, 152, "#fff", "center");
    if ((tick >> 5) & 1 || state === "title") text("Tekan SPASI / ▲ untuk " + (state === "title" ? "mulai" : "main lagi"), VW / 2, 172, "#fda4af", "center");
    return;
  }
  const cx = Math.round(cam);
  for (let i = -1; i < 4; i++) { // awan parallax
    const x = Math.round(i * 140 - (cam * 0.4) % 140), y = 20 + (i & 1) * 18;
    rect("#fff", x, y + 4, 40, 8); rect("#fff", x + 8, y, 20, 14);
  }
  for (let tx = Math.floor(cx / T); tx <= Math.floor((cx + VW) / T); tx++)
    for (let ty = 0; ty < H; ty++) {
      const ch = tile(tx, ty);
      if (ch === ".") continue;
      const b = bumps.find((b) => b.tx === tx && b.ty === ty);
      drawTile(ch, tx * T - cx, ty * T - (b ? Math.sin((b.t / 8) * Math.PI) * 4 : 0), tx, ty);
    }
  // Tiang bendera finis
  rect("#e5e7eb", GOAL_X - cx, 1 * T, 2, 9 * T);
  rect("#fde68a", GOAL_X - cx - 2, 1 * T - 4, 6, 6);
  rect("#f472b6", GOAL_X - cx - 18, 1 * T + 4 + ((tick >> 3) & 1), 18, 12);
  rect("#fff", GOAL_X - cx - 12, 1 * T + 8 + ((tick >> 3) & 1), 6, 4);

  for (const e of enemies) {
    if (e.dead) ctx.drawImage(GLOOMY, Math.round(e.x - cx), Math.round(e.y + 7), 12, 4);
    else if (!e.gone) ctx.drawImage(GLOOMY, Math.round(e.x - cx), Math.round(e.y));
  }
  for (const o of pops) drawStick(Math.round(o.x - cx), Math.round(o.y));
  const moving = !p.onGround || (Math.abs(p.vx) > 0.3 && (tick >> 3) & 1);
  ctx.drawImage(moving ? RAN_B : RAN_A, Math.round(p.x - 1 - cx), Math.round(p.y - 1));

  text(`♥ ${lives}`, 6, 12, "#e11d48");
  text(`LIGHTSTICK ${coins}`, 34, 12);
  text(`SKOR ${score}`, VW - 6, 12, "#fff", "right");
}

// ---------- Input & loop ----------
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "jump", KeyW: "jump", Space: "jump", KeyZ: "jump", Enter: "jump" };
addEventListener("keydown", (e) => { const k = KEYMAP[e.code]; if (k) { keys[k] = true; e.preventDefault(); } });
addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener("blur", () => { keys.left = keys.right = keys.jump = false; });
document.querySelectorAll(".pad button").forEach((b) => {
  const set = (v) => (e) => { e.preventDefault(); keys[b.dataset.k] = v; };
  b.addEventListener("pointerdown", set(true));
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, set(false));
});
cv.addEventListener("pointerdown", () => { if (state !== "play") { keys.jump = true; setTimeout(() => (keys.jump = false), 50); } });

let last = 0, acc = 0;
function loop(t) {
  acc += Math.min((t - last) / 1000, 0.1); last = t;
  while (acc >= 1 / 60) { update(); acc -= 1 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame((t) => { last = t; loop(t); });
cv.focus();
</script>
</body>
</html>
