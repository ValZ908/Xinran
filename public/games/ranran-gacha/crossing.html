<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranran Nyebrang Jalan</title>
<meta name="description" content="Game menyeberang jalan dengan Ranran (Song Xinran), hindari mobil yang lewat. Mini game fan-made.">
<style>
  :root { --bg: #09090b; --line: #ffffff1a; --text: #fafafa; --muted: #a1a1aa; --rose: #fda4af; --amber: #fde68a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at top, #3f1d2b 0%, var(--bg) 60%) fixed, var(--bg);
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .top a { color: var(--muted); }
  h1 { margin: 12px 0 16px; font-size: clamp(24px, 6vw, 34px); }
  h1 span { background: linear-gradient(90deg, var(--rose), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  canvas { display: block; width: 100%; aspect-ratio: 160 / 200; image-rendering: pixelated; border-radius: 12px; border: 1px solid var(--line); background: #000; touch-action: none; }
  .hint { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="top"><a href="index.html">← Gacha</a><a href="catch.html">Lightstick Catch →</a></div>
  <h1>Ranran <span>Nyebrang Jalan</span></h1>
  <canvas id="game" width="160" height="200" tabindex="0" aria-label="Game menyeberang jalan. Panah atau WASD untuk melompat, geser atau ketuk di layar sentuh, spasi untuk mulai."></canvas>
  <p class="hint">↑ ↓ ← → / WASD atau geser jari (ketuk = maju) · Hindari mobil 🚗 · Spasi / ketuk untuk mulai</p>
</main>

<script>
const VW = 160, VH = 200, T = 16, COLS = VW / T;
const cv = document.getElementById("game"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ---------- Sprite Ranran, sama dengan Lightstick Catch ----------
const PAL = {
  h: "#4a2318", H: "#8a4a32", s: "#ffe2d4", e: "#1c1917", l: "#e11d48", b: "#fda4af",
  w: "#fafafa", t: "#18181b", k: "#52525b", d: "#18181b",
};
function sprite(rows) {
  const c = document.createElement("canvas");
  c.width = rows[0].length; c.height = rows.length;
  const x = c.getContext("2d");
  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1); } }));
  return c;
}
const RAN = sprite([
  "...hhhhhh...", "..hHHhhhhh..", ".hhhhhhhhhh.", "hhhhhhhhhhhh", "hhsssssssshh", "hhsesssseshh",
  "hhsbssssbshh", "hhsssllssshh", "hhhwwttwwhhh", "hhwwwttwwwhh", "hswwwttwwwsh", ".swwwttwwws.",
  "..kkkkkkkk..", "..kkkkkkkk..", "...ss..ss...", "...dd..dd...",
]);

// ---------- Jalur: rumput (aman) atau jalan (ada mobil) ----------
const L = VW + 64; // panjang putaran mobil, mobil muncul lagi di sisi lain
const CAR_COLORS = ["#ef4444", "#3b82f6", "#f59e0b", "#a855f7", "#14b8a6", "#f4f4f5"];
console.assert(L / 3 - 30 >= T * 2, "celah antar mobil harus muat Ranran");
let lanes;
function lane(r) {
  if (!lanes.has(r)) {
    lanes.set(r, r < 3 || Math.random() < 0.3 ? { road: false } : {
      road: true,
      n: 1 + (Math.random() * 3 | 0),
      w: Math.random() < 0.25 ? 30 : 20,
      speed: (25 + Math.random() * 35) * (1 + r / 80), // makin jauh makin cepat
      dir: Math.random() < 0.5 ? 1 : -1,
      off: Math.random() * L,
      color: CAR_COLORS[Math.random() * CAR_COLORS.length | 0],
    });
  }
  return lanes.get(r);
}
// Posisi mobil dihitung langsung dari waktu, tanpa state per mobil
function carXs(ln) {
  return Array.from({ length: ln.n }, (_, i) => {
    const x = (ln.off + i * L / ln.n + ln.speed * t) % L;
    return (ln.dir > 0 ? x : L - x) - 32;
  });
}

// ---------- State ----------
let best = 0;
try { best = +localStorage.getItem("ranran-cross-best") || 0; } catch {}
let state = "title", t = 0, col, row, from, hopT, cam, camMin, score;
function reset() {
  lanes = new Map(); t = 0; col = COLS / 2 - 1; row = 0; from = { col, row }; hopT = 1;
  cam = 0; camMin = 0; score = 0; state = "play";
}

// ---------- Input ----------
function move(dc, dr) {
  if (state !== "play" || hopT < 1) return;
  const c = col + dc, r = row + dr;
  if (c < 0 || c >= COLS || r < camMin) return;
  from = { col, row }; col = c; row = r; hopT = 0;
  score = Math.max(score, row);
}
const DIRS = { ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
addEventListener("keydown", e => {
  if (DIRS[e.code] || e.code === "Space") e.preventDefault();
  if (e.code === "Space" && state !== "play") return reset();
  if (DIRS[e.code] && !e.repeat) move(...DIRS[e.code]);
});
let start = null;
cv.addEventListener("pointerdown", e => { start = [e.clientX, e.clientY]; });
cv.addEventListener("pointerup", e => {
  if (!start) return;
  const dx = e.clientX - start[0], dy = e.clientY - start[1]; start = null;
  if (state !== "play") return reset();
  if (Math.hypot(dx, dy) < 12) move(0, 1);
  else if (Math.abs(dx) > Math.abs(dy)) move(Math.sign(dx), 0);
  else move(0, -Math.sign(dy));
});

// ---------- Logic ----------
function update(dt) {
  t += dt;
  hopT = Math.min(1, hopT + dt / 0.12);
  camMin = Math.max(camMin, row - 3); // kamera hanya maju, tidak bisa mundur jauh
  cam += (camMin - cam) * Math.min(1, dt * 6);

  const ln = lane(row);
  const px = col * T + 3;
  if (ln.road && carXs(ln).some(x => x < px + 10 && x + ln.w > px)) {
    state = "dead";
    if (score > best) { best = score; try { localStorage.setItem("ranran-cross-best", best); } catch {} }
  }
}

// ---------- Render ----------
const rowY = r => VH - T - (r - cam) * T - 8;
function text(s, x, y, size = 8, color = "#fafafa") {
  ctx.font = `bold ${size}px monospace`; ctx.fillStyle = color; ctx.textAlign = "center"; ctx.fillText(s, x, y);
}
function drawCar(x, y, ln) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = "#18181b";
  ctx.fillRect(x + 3, y + 2, 4, 12); ctx.fillRect(x + ln.w - 7, y + 2, 4, 12); // roda
  ctx.fillStyle = ln.color; ctx.fillRect(x, y + 4, ln.w, 8);
  ctx.fillStyle = "#bae6fd"; ctx.fillRect(x + (ln.dir > 0 ? ln.w - 9 : 4), y + 5, 5, 6); // kaca depan
  ctx.fillStyle = "#fde68a"; ctx.fillRect(ln.dir > 0 ? x + ln.w - 1 : x, y + 5, 1, 6); // lampu
}
function draw(now) {
  if (state === "title") {
    ctx.fillStyle = "#1e0b16"; ctx.fillRect(0, 0, VW, VH);
    ctx.drawImage(RAN, VW / 2 - 6, 140);
    text("RANRAN", VW / 2, 60, 16, "#fda4af");
    text("NYEBRANG JALAN", VW / 2, 76, 8, "#fde68a");
    text("Spasi / ketuk untuk mulai", VW / 2, 110, 7, "#a1a1aa");
    if (best) text("Rekor: " + best, VW / 2, 124, 7, "#a1a1aa");
    return;
  }

  for (let r = Math.floor(cam) - 1; r <= cam + VH / T; r++) {
    const ln = lane(r), y = rowY(r);
    if (ln.road) {
      ctx.fillStyle = "#3f3f46"; ctx.fillRect(0, y, VW, T);
      if (!lane(r + 1).road) { ctx.fillStyle = "#a1a1aa"; ctx.fillRect(0, y, VW, 1); }
      else { ctx.fillStyle = "#fafafa66"; for (let x = 4; x < VW; x += 20) ctx.fillRect(x, y, 10, 1); }
    } else {
      ctx.fillStyle = r % 2 ? "#4d7c0f" : "#3f6212"; ctx.fillRect(0, y, VW, T);
    }
  }
  for (let r = Math.floor(cam) - 1; r <= cam + VH / T; r++) {
    const ln = lane(r);
    if (ln.road) for (const x of carXs(ln)) drawCar(x, rowY(r), ln);
  }

  // Lompatan: geser dari kotak lama ke baru dengan sedikit melambung
  const k = hopT, hx = (from.col + (col - from.col) * k) * T + 2;
  const hy = rowY(from.row + (row - from.row) * k) - Math.sin(Math.PI * k) * 4;
  if (state === "dead") {
    ctx.save(); ctx.translate(hx + 6, hy + 8); ctx.scale(1.2, 0.4); ctx.drawImage(RAN, -6, 0); ctx.restore();
  } else ctx.drawImage(RAN, Math.round(hx), Math.round(hy));

  ctx.textAlign = "left"; ctx.font = "bold 8px monospace"; ctx.fillStyle = "#fafafa";
  ctx.fillText("Langkah " + score, 4, 10);
  ctx.textAlign = "right"; ctx.fillStyle = "#fde68a";
  ctx.fillText("Rekor " + best, VW - 4, 10);

  if (state === "dead") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, VW, VH);
    text("TERTABRAK!", VW / 2, 80, 14, "#fda4af");
    text("Langkah: " + score, VW / 2, 98, 8);
    text("Rekor: " + best, VW / 2, 110, 8, "#fde68a");
    text("Spasi / ketuk untuk ulang", VW / 2, 132, 7, "#a1a1aa");
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play") update(dt);
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
cv.focus();
</script>
</body>
</html>
